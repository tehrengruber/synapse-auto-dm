[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "synapse-auto-dm"
version = "0.1.0"
description = "Synapse module that automatically creates DM rooms between users on registration"
requires-python = ">=3.9"
dependencies = ["matrix-synapse"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["synapse_auto_dm"]