[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-auto-dm"
version = "0.2.0"
description = "Synapse module that automatically creates DM rooms between users, and one room per user with themselves"
requires-python = ">=3.9"
dependencies = ["matrix-synapse>=1.90"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["synapse_auto_dm"]